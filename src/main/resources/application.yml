
spring:
  application:
    name: reactive-product-hub

  profiles:
    default: dev

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

external:
  products:
    base-url: https://dummyjson.com
    timeout: 3s


